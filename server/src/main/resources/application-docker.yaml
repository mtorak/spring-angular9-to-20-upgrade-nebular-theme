spring:
  data:
    mongodb:
      uri: mongodb://root:example@172.22.0.3:27017/
      database: chat_db

  security:
    oauth2:
      client:
        registration:
          google:
            clientId: OAUTH_GOOGLE_ID
            clientSecret: OAUTH_GOOGLE_SECRET
            scope:
              - email
              - profile
          facebook:
            clientId: ${OAUTH_FACEBOOK_ID}
            clientSecret: ${OAUTH_FACEBOOK_SECRET}
            scope:
              - email
              - public_profile

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

#logging
logging:
  level:
    org:
      springframework:
        web: trace
        security: debug
    error: trace

#docs
springdoc:
  version: '1.0.0'
  api-docs:
    path: /api/docs

app:
  auth:
    tokenSecret: OAUTH_EMAIL_SECRET_OAUTH_EMAIL_SECRET
    tokenExpirationMsec: 300000
  oauth2:
    authorizedRedirectUrls:
      - OAUTH_URI_WEB
      - OAUTH_URI_ANDROID
      - OAUTH_URI_IOS
  uploadsFolder: /tmp/angular9-nebular-uploads/
  cors:
    allowedOrigin: http://localhost:4200