<div class="container h-100">

    <div class="row h-100 justify-content-center align-items-center">
        <div class="col-lg-6 col-md-8 col-sm-10 col-12">

            <nb-card class="text-center">

                <nb-card-header>
                    <h2>Edit your profile</h2>
                </nb-card-header>

                <nb-card-body *ngIf="profile">

                    <div id="direct_upload" ng2FileDrop [uploader]="uploader">

                        <form [formGroup]="imageForm">

                            <input type='file' id="imageUpload" multiple accept=".png, .jpg, .jpeg" [uploader]="uploader"
                                (change)="fileOverBase($event)" ng2FileSelect #fileInput style="display:none;" />

                            <div class="profile-image" [ngStyle]="{'background-image': 'url(' + profile.imgUrl + ')'}"
                                (click)="fileInput.click()">
                                <div class="top-layer h-100 w-100 text-center">
                                    <nb-icon icon="edit"></nb-icon>
                                </div>
                            </div>

                            <h5 class="text-center mt-3 mb-3">{{profile.name}}</h5>

                            <button nbButton outline status="primary" (click)="continue()" size="large" class="mt-3">
                                Continue
                            </button>
                            <button nbButton outline status="secondary" (click)="discard()" size="large"
                                class="mt-3 ml-3">
                                Discard
                            </button>

                        </form>
                    </div>

                </nb-card-body>
                <nb-card-footer>
                    <p><strong>Powered By: Deepanshu Tagi</strong></p>
                </nb-card-footer>
            </nb-card>

        </div>
    </div>

</div>
