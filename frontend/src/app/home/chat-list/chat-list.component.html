<nb-card>

  <nb-card-header>
    <div class="row no-gutters align-items-center" *ngIf="profile">
      <div class="col-auto">
        <img src="{{profile.imgUrl}}" class="img-fluid rounded-circle" width="50px" height="50px" appImgFallback />
      </div>
      <div class="col">
        <h6 class="pl-3 pr-3">{{profile.name}}</h6>
      </div>
      <div class="col-auto">
        <nb-icon icon="more-vertical-outline" [nbContextMenu]="menu" nbContextMenuPlacement="left"
          nbContextMenuTag="context-chat-more"></nb-icon>
      </div>
    </div>
  </nb-card-header>

  <nb-card-body>
    <nb-form-field>
      <input nbInput fullWidth name="search" #search placeholder="Search" (input)="findChat(search.value)">
      <button nbSuffix nbButton ghost (click)="search.value='';clear()">
        <nb-icon icon="close-outline"></nb-icon>
      </button>
    </nb-form-field>
  </nb-card-body>
  <nb-list>
    <nb-list-item *ngFor="let friend of friends | async" (click)="chatClicked(friend.id)">
      <nb-user [name]="friend.name" [title]="friend.lastMsg" [picture]="friend.imgUrl">
      </nb-user>
    </nb-list-item>
  </nb-list>
</nb-card>
